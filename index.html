<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>时间记录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f6f5;
      color: #333;
      padding: 16px;
      padding-bottom: 40px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 22px; }
    .plan-link {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #7c5cbf;
      padding: 8px 12px;
      border-radius: 20px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .plan-link:active { opacity: 0.85; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: #eef2f1;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .tab {
      flex: 1;
      padding: 9px 4px;
      text-align: center;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      color: #666;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active {
      background: #fff;
      color: #14b8a6;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .input-box {
      width: 100%;
      min-height: 60px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #e0dcd5;
      border-radius: 10px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }
    .input-box:focus { outline: none; border-color: #14b8a6; }

    .row { display: flex; gap: 10px; margin-top: 10px; }
    .row input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #e0dcd5;
      border-radius: 10px;
      font-family: inherit;
      min-width: 0;
    }
    .row input:focus { outline: none; border-color: #14b8a6; }

    .field-label { font-size: 13px; color: #888; margin: 12px 0 4px; }

    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #14b8a6;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.85; }
    .btn.red { background: #ef5350; }

    .punch-panel { display: none; }
    .punch-panel.show { display: block; }
    .range-panel { display: none; }
    .range-panel.show { display: block; }
    .manual-panel { display: none; }
    .manual-panel.show { display: block; }

    .punch-status {
      text-align: center;
      padding: 14px;
      background: #f2f6f5;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .punch-status .label { font-size: 13px; color: #888; }
    .punch-status .time {
      font-size: 26px;
      font-weight: 700;
      color: #14b8a6;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .punch-from-plan {
      text-align: center;
      font-size: 13px;
      color: #7c5cbf;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .range-panel input[type="datetime-local"] {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #e0dcd5;
      border-radius: 10px;
      font-family: inherit;
      margin-top: 4px;
    }
    .range-panel input[type="datetime-local"]:focus { outline: none; border-color: #14b8a6; }
    .range-duration {
      text-align: center;
      font-size: 14px;
      color: #14b8a6;
      font-weight: 600;
      margin-top: 10px;
    }

    .summary { display: flex; gap: 10px; margin-bottom: 12px; }
    .summary-item {
      flex: 1;
      text-align: center;
      padding: 12px 6px;
      background: #f2f6f5;
      border-radius: 10px;
    }
    .summary-num { font-size: 20px; font-weight: 700; color: #14b8a6; }
    .summary-label { font-size: 12px; color: #888; margin-top: 4px; }

    .record-item {
      padding: 12px 0;
      border-bottom: 1px solid #f0ece6;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .record-item:last-child { border-bottom: none; }
    .record-info { flex: 1; min-width: 0; }
    .record-note {
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .record-meta { font-size: 13px; color: #999; margin-top: 6px; }
    .record-meta .duration { color: #14b8a6; font-weight: 600; }
    .record-meta .from-plan { color: #7c5cbf; }

    .btn-del {
      align-self: flex-start;
      background: none;
      border: none;
      color: #ccc;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .btn-del:active { color: #f44336; }

    .empty-tip {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⏱ 时间记录</h1>
    <a class="plan-link" href="plan.html">🌙 晚间规划</a>
  </div>

  <!-- 输入区 -->
  <div class="card">
    <div class="tabs">
      <div class="tab active" data-mode="manual">手动填写</div>
      <div class="tab" data-mode="punch">打点计时</div>
      <div class="tab" data-mode="range">选时间段</div>
    </div>

    <textarea class="input-box" id="taskInput" placeholder="做了什么？比如：写方案、看书、跑步…"></textarea>

    <!-- 手动填写 -->
    <div class="manual-panel show" id="manualPanel">
      <div class="row">
        <input type="number" id="hourInput" placeholder="小时" min="0" step="1">
        <input type="number" id="minInput" placeholder="分钟" min="0" max="59" step="1">
      </div>
      <button class="btn" id="btnSaveManual">记录</button>
    </div>

    <!-- 打点计时 -->
    <div class="punch-panel" id="punchPanel">
      <div class="punch-from-plan" id="punchFromPlan" style="display:none;"></div>
      <div class="punch-status">
        <div class="label" id="punchLabel">未开始</div>
        <div class="time" id="punchClock">00:00:00</div>
      </div>
      <button class="btn" id="btnPunch">开始计时</button>
      <div class="punch-list" id="punchList"></div>
    </div>

    <!-- 选时间段 -->
    <div class="range-panel" id="rangePanel">
      <div class="field-label">开始时间</div>
      <input type="datetime-local" id="startTime">
      <div class="field-label">结束时间</div>
      <input type="datetime-local" id="endTime">
      <div class="range-duration" id="rangeDuration"></div>
      <button class="btn" id="btnSaveRange">记录</button>
    </div>
  </div>

  <!-- 统计 + 历史 -->
  <div class="card">
    <div class="summary">
      <div class="summary-item">
        <div class="summary-num" id="sumCount">0</div>
        <div class="summary-label">总条数</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" id="sumToday">0</div>
        <div class="summary-label">今日(分钟)</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" id="sumTotal">0</div>
        <div class="summary-label">累计(小时)</div>
      </div>
    </div>
    <h2 style="font-size:17px;margin-bottom:8px;">历史记录</h2>
    <div id="recordList"></div>
  </div>

<script>
(function() {
  'use strict';

  var RECORD_KEY = 'time_records_v1';   // 保持原名，不抹掉旧数据
  var PLAN_KEY = 'night_plans_v1';      // 与 plan.html 共享

  var taskInput = document.getElementById('taskInput');
  var tabs = document.querySelectorAll('.tab');
  var manualPanel = document.getElementById('manualPanel');
  var punchPanel = document.getElementById('punchPanel');
  var rangePanel = document.getElementById('rangePanel');

  var hourInput = document.getElementById('hourInput');
  var minInput = document.getElementById('minInput');
  var btnSaveManual = document.getElementById('btnSaveManual');

  var btnPunch = document.getElementById('btnPunch');
  var punchLabel = document.getElementById('punchLabel');
  var punchClock = document.getElementById('punchClock');
  var punchList = document.getElementById('punchList');
  var punchFromPlan = document.getElementById('punchFromPlan');

  var startTime = document.getElementById('startTime');
  var endTime = document.getElementById('endTime');
  var rangeDuration = document.getElementById('rangeDuration');
  var btnSaveRange = document.getElementById('btnSaveRange');

  var recordList = document.getElementById('recordList');
  var sumCount = document.getElementById('sumCount');
  var sumToday = document.getElementById('sumToday');
  var sumTotal = document.getElementById('sumTotal');

  var currentMode = 'manual';
  var punchTimerId = null;
  var punchStartTs = null;
  var punchPlanId = null;  // 如果这次计时来自"晚间规划"，记住规划 id

  // ---------- 通用 ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function fullTimeStr() {
    var d = new Date();
    return todayStr() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fullTimeStrFromTs(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function toLocalInputValue(date) {
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
      + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }
  function formatDuration(mins) {
    if (mins < 60) return mins + ' 分钟';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return m === 0 ? h + ' 小时' : h + ' 小时 ' + m + ' 分钟';
  }
  function formatHMS(seconds) {
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function(m) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
    });
  }

  // ---------- 存储 ----------
  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(RECORD_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveRecords(records) {
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); }
    catch (e) { alert('存储空间不足，请删除一些旧记录后再试。'); }
  }
  function loadPlans() {
    try { return JSON.parse(localStorage.getItem(PLAN_KEY)) || []; }
    catch (e) { return []; }
  }
  function savePlans(plans) {
    localStorage.setItem(PLAN_KEY, JSON.stringify(plans));
  }

  // ---------- 模式切换 ----------
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      currentMode = this.getAttribute('data-mode');
      tabs.forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      manualPanel.classList.toggle('show', currentMode === 'manual');
      punchPanel.classList.toggle('show', currentMode === 'punch');
      rangePanel.classList.toggle('show', currentMode === 'range');
      if (currentMode === 'range') {
        if (!startTime.value) {
          var end = new Date();
          var start = new Date(end.getTime() - 60 * 60 * 1000);
          startTime.value = toLocalInputValue(start);
          endTime.value = toLocalInputValue(end);
        }
        updateRangeDuration();
      }
    });
  });

  // ---------- 手动 ----------
  btnSaveManual.addEventListener('click', function() {
    var task = taskInput.value.trim();
    var h = parseInt(hourInput.value, 10) || 0;
    var m = parseInt(minInput.value, 10) || 0;
    var total = h * 60 + m;
    if (!task) { alert('请写一下做了什么～'); return; }
    if (total <= 0) { alert('请填写时长（小时或分钟）'); return; }
    addRecord(task, total, fullTimeStr());
    taskInput.value = '';
    hourInput.value = '';
    minInput.value = '';
    renderList();
  });

  // ---------- 打点计时 ----------
  function startPunchTimer(task, startTs, planId) {
    punchStartTs = startTs || Date.now();
    punchPlanId = planId || null;
    taskInput.value = task;
    punchLabel.textContent = '进行中：' + task;
    punchList.innerHTML = '<div class="punch-point" style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px dashed #eee;color:#555;">'
      + '<span>开始</span><span>'
      + new Date(punchStartTs).toLocaleTimeString('zh-CN', {hour12:false}) + '</span></div>';
    btnPunch.textContent = '结束并记录';
    btnPunch.classList.add('red');

    if (punchTimerId) clearInterval(punchTimerId);
    punchTimerId = setInterval(function() {
      var sec = Math.floor((Date.now() - punchStartTs) / 1000);
      punchClock.textContent = formatHMS(sec);
    }, 1000);
    var sec0 = Math.floor((Date.now() - punchStartTs) / 1000);
    punchClock.textContent = formatHMS(sec0);

    if (punchPlanId) {
      punchFromPlan.style.display = 'block';
      punchFromPlan.textContent = '来自晚间规划 · 完成并记录后会标记为已完成';
    } else {
      punchFromPlan.style.display = 'none';
    }
  }

  btnPunch.addEventListener('click', function() {
    if (!punchStartTs) {
      // 开始
      if (!taskInput.value.trim()) { alert('请先写一下要做什么～'); return; }
      startPunchTimer(taskInput.value.trim(), Date.now(), null);
    } else {
      // 结束
      if (punchTimerId) { clearInterval(punchTimerId); punchTimerId = null; }
      var elapsedSec = Math.floor((Date.now() - punchStartTs) / 1000);
      var minutes = Math.max(1, Math.round(elapsedSec / 60));
      var startStr = fullTimeStrFromTs(punchStartTs);
      var endStr = fullTimeStr();
      var task = taskInput.value.trim();
      var planId = punchPlanId;

      addRecord(task, minutes, startStr + ' → ' + endStr, planId ? 'plan' : '');

      // 若来自规划，则把对应规划标记为已完成
      if (planId) {
        var plans = loadPlans().map(function(p) {
          if (p.id === planId) {
            p.done = true;
            p.doneAt = endStr;
            p.actual = minutes;
          }
          return p;
        });
        savePlans(plans);
      }

      // 重置
      punchStartTs = null;
      punchPlanId = null;
      punchLabel.textContent = '已记录';
      punchFromPlan.style.display = 'none';
      btnPunch.textContent = '开始计时';
      btnPunch.classList.remove('red');
      taskInput.value = '';
      renderList();
    }
  });

  // ---------- 时间范围 ----------
  function updateRangeDuration() {
    if (!startTime.value || !endTime.value) { rangeDuration.textContent = ''; return; }
    var s = new Date(startTime.value).getTime();
    var e = new Date(endTime.value).getTime();
    if (e <= s) { rangeDuration.textContent = '结束时间必须晚于开始时间'; return; }
    var mins = Math.round((e - s) / 60000);
    rangeDuration.textContent = '时长：' + formatDuration(mins);
  }
  startTime.addEventListener('change', updateRangeDuration);
  endTime.addEventListener('change', updateRangeDuration);
  startTime.addEventListener('input', updateRangeDuration);
  endTime.addEventListener('input', updateRangeDuration);

  btnSaveRange.addEventListener('click', function() {
    var task = taskInput.value.trim();
    if (!task) { alert('请写一下做了什么～'); return; }
    if (!startTime.value || !endTime.value) { alert('请选择开始和结束时间'); return; }
    var s = new Date(startTime.value).getTime();
    var e = new Date(endTime.value).getTime();
    if (e <= s) { alert('结束时间必须晚于开始时间'); return; }
    var mins = Math.max(1, Math.round((e - s) / 60000));
    var timeText = startTime.value.replace('T', ' ') + ' → ' + endTime.value.replace('T', ' ');
    addRecord(task, mins, timeText);
    taskInput.value = '';
    startTime.value = endTime.value;
    endTime.value = '';
    rangeDuration.textContent = '';
    renderList();
  });

  // ---------- 添加记录 ----------
  function addRecord(task, minutes, timeText, tag) {
    var records = loadRecords();
    records.unshift({
      task: task,
      minutes: minutes,
      time: timeText,
      tag: tag || ''
    });
    saveRecords(records);
  }

  // ---------- 渲染 ----------
  function renderList() {
    var records = loadRecords();
    var today = todayStr();
    var todayMins = 0;
    var totalMins = 0;
    records.forEach(function(r) {
      totalMins += r.minutes;
      if (r.time.indexOf(today) === 0) todayMins += r.minutes;
    });
    sumCount.textContent = records.length;
    sumToday.textContent = todayMins;
    sumTotal.textContent = (totalMins / 60).toFixed(1);

    if (records.length === 0) {
      recordList.innerHTML = '<div class="empty-tip">还没有记录，开始第一条吧～</div>';
      return;
    }

    var html = '';
    records.forEach(function(r) {
      html += '<div class="record-item">'
            +   '<div class="record-info">'
            +     '<div class="record-note">' + escapeHtml(r.task) + '</div>'
            +     '<div class="record-meta">'
            +       '<span class="duration">' + formatDuration(r.minutes) + '</span>'
            +       ' · ' + escapeHtml(r.time)
            +       (r.tag === 'plan' ? ' · <span class="from-plan">🌙 规划</span>' : '')
            +     '</div>'
            +   '</div>'
            +   '<button class="btn-del" data-time="' + escapeHtml(r.time) + '" data-task="' + escapeHtml(r.task) + '">×</button>'
            + '</div>';
    });
    recordList.innerHTML = html;

    recordList.querySelectorAll('.btn-del').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var t = this.getAttribute('data-time');
        var task = this.getAttribute('data-task');
        if (confirm('确定删除这条记录吗？')) {
          var recs = loadRecords().filter(function(r) {
            return !(r.time === t && r.task === task);
          });
          saveRecords(recs);
          renderList();
        }
      });
    });
  }

  // ---------- 检查是否从 plan.html 跳过来要启动计时 ----------
  function checkPendingTimer() {
    var raw = null;
    try { raw = sessionStorage.getItem('pending_timer_task'); } catch (e) {}
    if (!raw) return;
    try { sessionStorage.removeItem('pending_timer_task'); } catch (e) {}
    var data = JSON.parse(raw);
    if (!data || !data.task) return;

    // 自动切到打点计时 tab
    currentMode = 'punch';
    tabs.forEach(function(t) { t.classList.remove('active'); });
    document.querySelector('.tab[data-mode="punch"]').classList.add('active');
    manualPanel.classList.remove('show');
    rangePanel.classList.remove('show');
    punchPanel.classList.add('show');

    startPunchTimer(data.task, data.startTs || Date.now(), data.id);
    renderList();
  }

  // ---------- 初始化 ----------
  renderList();
  checkPendingTimer();
})();
</script>
</body>
</html>
